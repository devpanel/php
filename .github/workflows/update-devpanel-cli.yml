name: Update DevPanel CLI binaries

# Build devpanel binaries from https://gitlab.com/devpanel-vn/cli. The
# platforms input selects the list for that run. An empty input uses the
# PLATFORMS repository variable, or linux/amd64,linux/arm64 when that variable
# is unset. linux/amd64 builds on ubuntu-26.04 and linux/arm64 builds on
# ubuntu-26.04-arm. Other architectures build on ubuntu-26.04 with QEMU.
# Variants of one architecture share one binary. 32-bit ARM is built with
# GOARM=5 so base/bin/devpanel-arm runs on v5, v6, and v7.
#
# Run it manually on a branch. The workflow pushes directly to unprotected
# branches. If branch protection rejects that push, it opens or updates a pull
# request from a deterministic update branch, then approves its pending Test
# run. When repository auto-merge is enabled, it requests rebase auto-merge and
# exits without waiting. Otherwise it waits for Test before attempting a rebase
# merge. Each platform binary has its own Actions cache key, so a cached
# platform is skipped and the others still build. The updater saves those keys
# after direct updates and confirmed merges; cache-devpanel-cli.yml handles
# deferred auto-merges. The key is
# gitlab-devpanel-client-v1-<ref>-<upstream sha>-linux-<arch>, for example
# linux-amd64 or linux-arm. Delete one architecture's cache entry to rebuild
# that binary for the same commit.
#
# The plan job resolves the default branch HEAD through Git; the build fetches
# that commit under RUNNER_TEMP. GITLAB_TOKEN needs read_repository access and
# authenticates Git requests with GitLab's oauth2 username. The workflow token
# handles all pushes and PR operations. GHCR_TOKEN (a PAT with repo scope) is
# used only to approve the update PR's Test run.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: >
          Comma-separated list of platforms to build.
          Leave empty to use the PLATFORMS repository variable,
          falling back to "linux/amd64,linux/arm64".

concurrency:
  group: update-devpanel-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Check cached DevPanel CLI revision
    if: github.ref_type == 'branch'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.upstream.outputs.sha }}
      changed: ${{ steps.platforms.outputs.changed }}
      builds: ${{ steps.platforms.outputs.builds }}
      built: ${{ steps.platforms.outputs.built }}
    steps:
      - name: Resolve upstream default branch HEAD
        id: upstream
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          if [[ -z "${GITLAB_TOKEN}" ]]; then
            echo "::error::GITLAB_TOKEN is required to read gitlab.com/devpanel-vn/cli."
            exit 1
          fi

          auth=$(printf 'oauth2:%s' "${GITLAB_TOKEN}" | base64 -w0)
          echo "::add-mask::${auth}"
          head=$(git -c "http.https://gitlab.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            ls-remote https://gitlab.com/devpanel-vn/cli.git HEAD)
          sha=${head%%$'\t'*}
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to resolve the GitLab CLI default branch HEAD through Git."
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "GitLab CLI default branch HEAD is ${sha}"

      - name: Select uncached platforms
        id: platforms
        env:
          RAW_PLATFORMS: ${{ inputs.platforms || vars.PLATFORMS || 'linux/amd64,linux/arm64' }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          declare -A arch_goarm=()
          declare -A arch_qemu_noted=()
          order=()
          IFS=',' read -ra plats <<< "${RAW_PLATFORMS}"
          for p in "${plats[@]}"; do
            p="${p// /}"
            [[ -z "${p}" ]] && continue
            case "${p}" in
              linux/arm64/v8) p="linux/arm64" ;;
              linux/amd64/v1) p="linux/amd64" ;;
            esac
            rest="${p#linux/}"
            arch="${rest%%/*}"
            platform_key="linux-${arch}"
            if [[ "${p}" != linux/* || -z "${arch}" || ! "${platform_key}" =~ ^linux(-[a-z0-9]+)+$ ]]; then
              echo "::error::Unsupported platform ${p}."
              exit 1
            fi
            if [[ -z "${arch_goarm[${arch}]+x}" ]]; then
              order+=("${arch}")
              arch_goarm["${arch}"]=""
            fi
            if [[ "${arch}" == "arm" ]]; then
              if [[ -z "${arch_goarm[${arch}]}" ]]; then
                echo "::notice::32-bit ARM platforms share base/bin/devpanel-arm, built with GOARM=5 so it runs on v5, v6, and v7."
              fi
              arch_goarm["${arch}"]=5
            elif [[ "${rest}" == */* ]]; then
              echo "::notice::${p} uses the shared ${arch} binary at its lowest compatible level."
            fi
          done
          if [[ "${#order[@]}" -eq 0 ]]; then
            echo "::error::No platforms were selected."
            exit 1
          fi
          entries=()
          for arch in "${order[@]}"; do
            platform_key="linux-${arch}"
            goarm="${arch_goarm[${arch}]}"
            case "${arch}" in
              amd64) runner="ubuntu-26.04"; qemu=false ;;
              arm64) runner="ubuntu-26.04-arm"; qemu=false ;;
              *)
                runner="ubuntu-26.04"
                qemu=true
                if [[ -z "${arch_qemu_noted[${arch}]+x}" ]]; then
                  echo "::notice::${platform_key} has no native runner; it will be cross-compiled and checked with QEMU."
                  arch_qemu_noted["${arch}"]=1
                fi
                ;;
            esac
            cache_key="gitlab-devpanel-client-v1-${GITHUB_REF}-${UPSTREAM_SHA}-${platform_key}"
            encoded_key=$(printf '%s' "${cache_key}" | jq -sRr @uri)
            encoded_ref=$(printf '%s' "${GITHUB_REF}" | jq -sRr @uri)
            payload=$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100&key=${encoded_key}&ref=${encoded_ref}")
            count=$(jq --arg key "${cache_key}" '[.actions_caches[]? | select(.key == $key)] | length' <<< "${payload}")
            if [[ "${count}" != "0" ]]; then
              echo "GitLab CLI ${UPSTREAM_SHA} ${platform_key} is already built for this branch."
              continue
            fi
            echo "GitLab CLI ${UPSTREAM_SHA} ${platform_key} has not been built for this branch."
            entries+=("$(jq -nc \
              --arg arch "${arch}" \
              --arg platform "${platform_key}" \
              --arg runner "${runner}" \
              --arg goarm "${goarm}" \
              --argjson qemu "${qemu}" \
              '{arch:$arch,platform:$platform,runner:$runner,qemu:$qemu,goarm:$goarm}')")
          done
          if [[ "${#entries[@]}" -eq 0 ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "builds=[]" >> "$GITHUB_OUTPUT"
            echo "built=[]" >> "$GITHUB_OUTPUT"
            echo "Every selected platform is already cached."
          else
            matrix="$(printf '%s\n' "${entries[@]}" | jq -sc '.')"
            built="$(printf '%s\n' "${entries[@]}" | jq -sc 'map(.platform)')"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "builds=${matrix}" >> "$GITHUB_OUTPUT"
            echo "built=${built}" >> "$GITHUB_OUTPUT"
            echo "Building ${matrix}"
          fi

  build:
    name: Build devpanel (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Fetch GitLab CLI
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          UPSTREAM_SHA: ${{ needs.plan.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/devpanel-cli"
          mkdir "$dest"
          auth=$(printf 'oauth2:%s' "${GITLAB_TOKEN}" | base64 -w0)
          echo "::add-mask::${auth}"
          git -C "$dest" init
          git -C "$dest" remote add origin https://gitlab.com/devpanel-vn/cli.git
          git -C "$dest" -c "http.https://gitlab.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C "$dest" checkout --detach FETCH_HEAD

      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/devpanel-cli/go.mod
          cache: false

      - name: Build client binary
        working-directory: ${{ runner.temp }}/devpanel-cli
        env:
          ARCH: ${{ matrix.arch }}
          QEMU: ${{ matrix.qemu }}
          GOARM_VALUE: ${{ matrix.goarm }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
          GOPRIVATE: gitlab.com/devpanel-vn/*
        run: |
          set -euo pipefail
          if [[ ! -d cmd/devpanel-client ]]; then
            echo "::error::GitLab source does not contain cmd/devpanel-client; verify the client build path."
            exit 1
          fi
          auth=$(printf 'oauth2:%s' "${GITLAB_TOKEN}" | base64 -w0)
          echo "::add-mask::${auth}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://gitlab.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          dest="${RUNNER_TEMP}/devpanel-${ARCH}"
          build_env=(CGO_ENABLED=0)
          if [[ "${QEMU}" == "true" ]]; then
            build_env+=(GOOS=linux GOARCH="${ARCH}")
          fi
          if [[ -n "${GOARM_VALUE}" ]]; then
            build_env+=(GOARM="${GOARM_VALUE}")
          fi
          env -u GOOS -u GOARCH -u GOARM "${build_env[@]}" \
            go build -trimpath -o "$dest" ./cmd/devpanel-client
          unset GITLAB_TOKEN GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 auth
          chmod 0755 "$dest"
          "$dest" version
          "$dest" app trigger --help

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: devpanel-binary-${{ matrix.arch }}
          path: ${{ runner.temp }}/devpanel-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit devpanel binaries
    needs: [plan, build]
    if: needs.plan.outputs.changed == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-26.04
    outputs:
      cacheable: ${{ steps.commit-binaries.outputs.cacheable }}
      platforms: ${{ steps.commit-binaries.outputs.platforms }}
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: devpanel-binary-*
          path: dist
          merge-multiple: "true"

      - name: Commit binaries
        id: commit-binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_TOKEN: ${{ secrets.GHCR_TOKEN }}
          TARGET_BRANCH: ${{ github.ref_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          UPSTREAM_SHA: ${{ needs.plan.outputs.sha }}
          BUILT_PLATFORMS: ${{ needs.plan.outputs.built }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # One downloaded artifact is extracted directly into dist/. Several
          # artifacts use dist/<artifact>/ unless merge-multiple flattens them.
          candidates=(dist/*/devpanel-* dist/devpanel-*)
          binaries=()
          seen_bins=" "
          for candidate in "${candidates[@]}"; do
            [[ -f "${candidate}" ]] || continue
            name="$(basename "${candidate}")"
            if [[ "${seen_bins}" == *" ${name} "* ]]; then
              continue
            fi
            seen_bins="${seen_bins}${name} "
            binaries+=("${candidate}")
          done
          if [[ "${#binaries[@]}" -eq 0 ]]; then
            echo "::error::No devpanel binaries were downloaded."
            exit 1
          fi
          paths=()
          for binary in "${binaries[@]}"; do
            name="$(basename "${binary}")"
            install -m 0755 "${binary}" "base/bin/${name}"
            paths+=("base/bin/${name}")
          done
          platforms=$(jq -r 'join(" ")' <<< "${BUILT_PLATFORMS}")
          if [[ -z "${platforms}" || "${platforms}" == "null" ]]; then
            echo "::error::No platforms were selected for the commit."
            exit 1
          fi
          git add -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo "Build produced no changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit \
              -m "Update devpanel CLI from GitLab devpanel-vn/cli@${UPSTREAM_SHA}" \
              -m "Built ${platforms} from cmd/devpanel-client at that commit."

            commit_sha=$(git rev-parse HEAD)

            if push_output=$(git push origin "${commit_sha}:refs/heads/${TARGET_BRANCH}" 2>&1); then
              printf '%s\n' "${push_output}"
            else
              push_status=$?
              printf '%s\n' "${push_output}"
              if ! grep -Eiq 'GH006|GH013|protected branch|repository rule violations|required status check' <<< "${push_output}"; then
                echo "::error::Direct push to ${TARGET_BRANCH} failed for a reason other than branch protection."
                exit "${push_status}"
              fi
              if [[ -z "${TEST_TOKEN}" ]]; then
                echo "::error::GHCR_TOKEN with repo scope is required to approve Test for protected-branch updates."
                exit 1
              fi
              echo "::notice::Branch protection rejected the direct push to ${TARGET_BRANCH}; opening or updating a pull request."
              target_hash=$(printf '%s' "${TARGET_BRANCH}" | sha256sum | cut -d ' ' -f 1)
              branch="devpanel-cli-update-${target_hash}-${UPSTREAM_SHA:0:12}"
              test_branch="${branch}"
              # A pending update for this revision may already hold other architectures.
              # Rebase this run's commit onto it so those binaries are kept.
              prior_ref="refs/pending-devpanel-cli"
              if git fetch --depth 1 origin "+refs/heads/${branch}:${prior_ref}"; then
                prior_sha=$(git rev-parse "${prior_ref}")
                prior_message=$(git log -1 --format=%B "${prior_sha}")
                prior_subject=$(printf '%s\n' "${prior_message}" | head -n 1)
                prior_line=$(printf '%s\n' "${prior_message}" | sed -n '/^Built /p' | head -n 1)
                if [[ "${prior_subject}" =~ ^Update\ devpanel\ CLI\ from\ GitLab\ devpanel-vn/cli@([0-9a-f]{40})$ ]] \
                    && [[ "${BASH_REMATCH[1]}" == "${UPSTREAM_SHA}" ]] \
                    && [[ "${prior_line}" =~ ^Built[[:space:]](.+)[[:space:]]from[[:space:]]cmd/devpanel-client[[:space:]]at[[:space:]]that[[:space:]]commit\.$ ]]; then
                  prior_list="${BASH_REMATCH[1]}"
                  prior_list="${prior_list//linux\//linux-}"
                  prior_list="${prior_list// and / }"
                  valid=1
                  for token in ${prior_list}; do
                    if [[ ! "${token}" =~ ^linux(-[a-z0-9]+)+$ ]]; then
                      valid=0
                      break
                    fi
                  done
                  if [[ "${valid}" -eq 1 ]]; then
                    union=()
                    seen_platforms=" "
                    for token in ${prior_list} ${platforms}; do
                      if [[ "${seen_platforms}" != *" ${token} "* ]]; then
                        seen_platforms="${seen_platforms}${token} "
                        union+=("${token}")
                      fi
                    done
                    platforms="${union[*]}"
                    base_sha=$(git rev-parse HEAD~1)
                    git rebase -X theirs --onto "${prior_sha}" "${base_sha}"
                    git commit --amend \
                      -m "Update devpanel CLI from GitLab devpanel-vn/cli@${UPSTREAM_SHA}" \
                      -m "Built ${platforms} from cmd/devpanel-client at that commit."
                    commit_sha=$(git rev-parse HEAD)
                    echo "Rebased onto the pending update and recorded ${platforms}."
                  fi
                fi
              fi
              pr=$(gh pr list \
                --state all \
                --base "${TARGET_BRANCH}" \
                --head "${test_branch}" \
                --limit 100 \
                --json number,state,headRefName,headRepositoryOwner \
                | jq -r --arg branch "${test_branch}" --arg owner "${REPOSITORY_OWNER}" \
                  '.[] | select(.headRefName == $branch and .headRepositoryOwner.login == $owner and .state != "MERGED") | [.number, .state] | @tsv' \
                | head -n 1)
              title="Update DevPanel CLI binaries"
              body="Updates the DevPanel CLI binaries from GitLab revision ${UPSTREAM_SHA}. The Test workflow validates the generated binaries after this pull request is created or updated."
              if [[ -n "${pr}" ]]; then
                read -r pr_number pr_state <<< "${pr}"
                if [[ "${pr_state}" == "CLOSED" ]]; then
                  gh pr reopen "${pr_number}"
                fi
                git push --force origin "HEAD:refs/heads/${branch}"
                gh pr edit "${pr_number}" --title "${title}" --body "${body}"
              else
                git push --force origin "HEAD:refs/heads/${branch}"
                gh pr create \
                  --base "${TARGET_BRANCH}" \
                  --head "${test_branch}" \
                  --title "${title}" \
                  --body "${body}"
              fi
              pr_number=$(gh pr view "${test_branch}" --json number --jq '.number')
              test_run=""
              for ((attempt = 0; attempt < 60; attempt++)); do
                test_run=$(gh api --method GET \
                  "repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs" \
                  -f event=pull_request \
                  -f branch="${test_branch}" \
                  -f head_sha="${commit_sha}" \
                  -f per_page=100 \
                  --jq "[.workflow_runs[] | select(any(.pull_requests[]; .number == ${pr_number}))] | sort_by(.id) | last // empty")
                if [[ -n "${test_run}" ]]; then
                  break
                fi
                sleep 10
              done
              if [[ -z "${test_run}" ]]; then
                echo "::error::Timed out waiting for the PR Test workflow run for ${commit_sha}."
                exit 1
              fi
              test_run_id=$(jq -r '.id' <<< "${test_run}")
              if [[ "$(jq -r '.conclusion' <<< "${test_run}")" == "action_required" ]]; then
                GH_TOKEN="${TEST_TOKEN}" gh api --method POST \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${test_run_id}/approve"
              fi

              auto_merge=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.allow_auto_merge')
              if [[ "${auto_merge}" == "true" ]]; then
                gh pr merge "${test_branch}" \
                  --rebase \
                  --auto \
                  --match-head-commit "${commit_sha}"
              else
                echo "::notice::Repository auto-merge is disabled; waiting for Test before attempting a rebase merge."
                echo "Waiting for Test workflow run ${test_run_id} on ${test_branch}."
                timeout 21600 gh run watch "${test_run_id}" --exit-status --interval 30
                gh pr merge "${test_branch}" \
                  --rebase \
                  --match-head-commit "${commit_sha}"
              fi
              merged_pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
                --jq 'select(.merged) | [.head.sha, .base.ref] | @tsv')
              if [[ "${merged_pr}" != "${commit_sha}"$'\t'"${TARGET_BRANCH}" ]]; then
                echo "::notice::Merge of ${commit_sha} into ${TARGET_BRANCH} is not confirmed; skipping the revision cache."
                exit 0
              fi
            fi
          fi
          committed_platforms=$(jq -nc --arg list "${platforms}" '$list | split(" ")')
          echo "platforms=${committed_platforms}" >> "$GITHUB_OUTPUT"
          echo "cacheable=true" >> "$GITHUB_OUTPUT"

  save-cache:
    name: Cache ${{ matrix.platform }}
    needs: [plan, commit]
    if: needs.commit.outputs.cacheable == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.commit.outputs.platforms) }}
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Record the built revision
        env:
          UPSTREAM_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          mkdir -p "${RUNNER_TEMP}/devpanel-cli-revision"
          printf '%s\n' "${UPSTREAM_SHA}" > "${RUNNER_TEMP}/devpanel-cli-revision/sha"

      - name: Save the platform revision
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/devpanel-cli-revision
          key: gitlab-devpanel-client-v1-${{ github.ref }}-${{ needs.plan.outputs.sha }}-${{ matrix.platform }}
