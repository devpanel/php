name: Update DevPanel CLI binaries

# Build linux/amd64 and linux/arm64 devpanel binaries from
# https://gitlab.com/devpanel-vn/cli and commit
# base/bin/devpanel-amd64 and base/bin/devpanel-arm64.
#
# Run it manually on a branch. The Actions cache records the upstream default
# branch HEAD after both binaries are committed to this branch. Delete that
# cache entry to rebuild the same commit.
#
# The plan job queries GitLab's API; the build fetches the commit under RUNNER_TEMP.
# GITLAB_TOKEN must have read_api and read_repository access.
# GITLAB_USER is used to authenticate the Git fetch.
# The workflow token commits the binaries.

on:
  workflow_dispatch:

concurrency:
  group: update-devpanel-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Check cached DevPanel CLI revision
    if: github.ref_type == 'branch'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.upstream.outputs.sha }}
      changed: ${{ steps.decision.outputs.changed }}
    steps:
      - name: Resolve upstream default branch HEAD
        id: upstream
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GITLAB_TOKEN}" ]]; then
            echo "::error::GITLAB_TOKEN is required to read gitlab.com/devpanel-vn/cli."
            exit 1
          fi

          commits=$(curl --fail --silent --show-error \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "https://gitlab.com/api/v4/projects/devpanel-vn%2Fcli/repository/commits?per_page=1")
          sha=$(jq -r '.[0].id // empty' <<< "$commits")
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to resolve the GitLab CLI default branch HEAD."
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "GitLab CLI default branch HEAD is ${sha}"

      - name: Restore the built revision
        id: revision-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/devpanel-cli-revision
          key: gitlab-devpanel-client-v1-${{ github.ref }}-${{ steps.upstream.outputs.sha }}
          lookup-only: true

      - name: Decide whether to rebuild
        id: decision
        env:
          CACHE_HIT: ${{ steps.revision-cache.outputs.cache-hit }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          if [[ "${CACHE_HIT}" == "true" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "GitLab CLI ${UPSTREAM_SHA} is already built for this branch."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "GitLab CLI ${UPSTREAM_SHA} has not been built for this branch."
          fi

  build:
    name: Build devpanel (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Fetch GitLab CLI
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_USER: ${{ vars.GITLAB_USER }}
          UPSTREAM_SHA: ${{ needs.plan.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/devpanel-cli"
          mkdir "$dest"
          auth=$(printf '%s:%s' "${GITLAB_USER}" "${GITLAB_TOKEN}" | base64 -w0)
          echo "::add-mask::${auth}"
          git -C "$dest" init
          git -C "$dest" remote add origin https://gitlab.com/devpanel-vn/cli.git
          git -C "$dest" -c "http.https://gitlab.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C "$dest" checkout --detach FETCH_HEAD

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/devpanel-cli/go.mod
          cache: false

      - name: Build native client binary
        working-directory: ${{ runner.temp }}/devpanel-cli
        env:
          ARCH: ${{ matrix.arch }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_USER: ${{ vars.GITLAB_USER }}
          GIT_TERMINAL_PROMPT: "0"
          GOPRIVATE: gitlab.com/devpanel-vn/*
        run: |
          set -euo pipefail
          if [[ ! -d cmd/devpanel-client ]]; then
            echo "::error::GitLab source does not contain cmd/devpanel-client; verify the client build path."
            exit 1
          fi
          auth=$(printf '%s:%s' "${GITLAB_USER}" "${GITLAB_TOKEN}" | base64 -w0)
          echo "::add-mask::${auth}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://gitlab.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          dest="${RUNNER_TEMP}/devpanel-${ARCH}"
          env -u GOOS -u GOARCH CGO_ENABLED=0 \
            go build -trimpath -o "$dest" ./cmd/devpanel-client
          unset GITLAB_TOKEN GITLAB_USER GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 auth
          chmod 0755 "$dest"
          "$dest" version
          "$dest" app trigger --help

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: devpanel-binary-${{ matrix.arch }}
          path: ${{ runner.temp }}/devpanel-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit devpanel binaries
    needs: [plan, build]
    if: needs.plan.outputs.changed == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download amd64 binary
        uses: actions/download-artifact@v8
        with:
          name: devpanel-binary-amd64
          path: dist/amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: devpanel-binary-arm64
          path: dist/arm64

      - name: Commit binaries
        env:
          UPSTREAM_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          install -m 0755 dist/amd64/devpanel-amd64 base/bin/devpanel-amd64
          install -m 0755 dist/arm64/devpanel-arm64 base/bin/devpanel-arm64
          git add -- base/bin/devpanel-amd64 base/bin/devpanel-arm64
          if git diff --cached --quiet; then
            echo "Build produced no changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit \
              -m "Update devpanel CLI from GitLab devpanel-vn/cli@${UPSTREAM_SHA}" \
              -m "Built linux/amd64 and linux/arm64 from cmd/devpanel-client at that commit."
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Record the built revision
        env:
          UPSTREAM_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          mkdir -p "${RUNNER_TEMP}/devpanel-cli-revision"
          printf '%s\n' "${UPSTREAM_SHA}" > "${RUNNER_TEMP}/devpanel-cli-revision/sha"

      - name: Save the built revision
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/devpanel-cli-revision
          key: gitlab-devpanel-client-v1-${{ github.ref }}-${{ needs.plan.outputs.sha }}
