name: Update DevPanel CLI binaries

# Build linux/amd64 and linux/arm64 devpanel binaries from
# https://gitlab.com/devpanel-vn/cli and commit
# base/bin/devpanel-amd64 and base/bin/devpanel-arm64.
#
# Run it manually on a branch. The workflow pushes directly to unprotected
# branches. If branch protection rejects that push, it opens or updates a pull
# request from a deterministic update branch, then waits for its Test run. The
# updater records the upstream default branch HEAD in the Actions cache only
# after the target branch is updated. Delete that cache entry to rebuild the
# same upstream commit.
#
# The plan job resolves the default branch HEAD through Git; the build fetches
# that commit under RUNNER_TEMP. GITLAB_TOKEN needs read_repository access and
# authenticates Git requests with GitLab's oauth2 username.
# The workflow token pushes directly to the target branch. GHCR_TOKEN (a PAT
# with repo scope) and GHCR_USER authenticate update-branch pushes and PR
# operations so pull_request events trigger Test, including on repeated runs.

on:
  workflow_dispatch:

concurrency:
  group: update-devpanel-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Check cached DevPanel CLI revision
    if: github.ref_type == 'branch'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.upstream.outputs.sha }}
      changed: ${{ steps.decision.outputs.changed }}
    steps:
      - name: Resolve upstream default branch HEAD
        id: upstream
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          if [[ -z "${GITLAB_TOKEN}" ]]; then
            echo "::error::GITLAB_TOKEN is required to read gitlab.com/devpanel-vn/cli."
            exit 1
          fi

          auth=$(printf 'oauth2:%s' "${GITLAB_TOKEN}" | base64 -w0)
          echo "::add-mask::${auth}"
          head=$(git -c "http.https://gitlab.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            ls-remote https://gitlab.com/devpanel-vn/cli.git HEAD)
          sha=${head%%$'\t'*}
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to resolve the GitLab CLI default branch HEAD through Git."
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "GitLab CLI default branch HEAD is ${sha}"

      - name: Restore the built revision
        id: revision-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/devpanel-cli-revision
          key: gitlab-devpanel-client-v1-${{ github.ref }}-${{ steps.upstream.outputs.sha }}
          lookup-only: true

      - name: Decide whether to rebuild
        id: decision
        env:
          CACHE_HIT: ${{ steps.revision-cache.outputs.cache-hit }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          if [[ "${CACHE_HIT}" == "true" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "GitLab CLI ${UPSTREAM_SHA} is already built for this branch."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "GitLab CLI ${UPSTREAM_SHA} has not been built for this branch."
          fi

  build:
    name: Build devpanel (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Fetch GitLab CLI
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          UPSTREAM_SHA: ${{ needs.plan.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/devpanel-cli"
          mkdir "$dest"
          auth=$(printf 'oauth2:%s' "${GITLAB_TOKEN}" | base64 -w0)
          echo "::add-mask::${auth}"
          git -C "$dest" init
          git -C "$dest" remote add origin https://gitlab.com/devpanel-vn/cli.git
          git -C "$dest" -c "http.https://gitlab.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C "$dest" checkout --detach FETCH_HEAD

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/devpanel-cli/go.mod
          cache: false

      - name: Build native client binary
        working-directory: ${{ runner.temp }}/devpanel-cli
        env:
          ARCH: ${{ matrix.arch }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
          GOPRIVATE: gitlab.com/devpanel-vn/*
        run: |
          set -euo pipefail
          if [[ ! -d cmd/devpanel-client ]]; then
            echo "::error::GitLab source does not contain cmd/devpanel-client; verify the client build path."
            exit 1
          fi
          auth=$(printf 'oauth2:%s' "${GITLAB_TOKEN}" | base64 -w0)
          echo "::add-mask::${auth}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://gitlab.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          dest="${RUNNER_TEMP}/devpanel-${ARCH}"
          env -u GOOS -u GOARCH CGO_ENABLED=0 \
            go build -trimpath -o "$dest" ./cmd/devpanel-client
          unset GITLAB_TOKEN GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 auth
          chmod 0755 "$dest"
          "$dest" version
          "$dest" app trigger --help

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: devpanel-binary-${{ matrix.arch }}
          path: ${{ runner.temp }}/devpanel-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit devpanel binaries
    needs: [plan, build]
    if: needs.plan.outputs.changed == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Download amd64 binary
        uses: actions/download-artifact@v8
        with:
          name: devpanel-binary-amd64
          path: dist/amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: devpanel-binary-arm64
          path: dist/arm64

      - name: Commit binaries
        id: commit-binaries
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          PR_USER: ${{ vars.GHCR_USER }}
          TARGET_BRANCH: ${{ github.ref_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          UPSTREAM_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          install -m 0755 dist/amd64/devpanel-amd64 base/bin/devpanel-amd64
          install -m 0755 dist/arm64/devpanel-arm64 base/bin/devpanel-arm64
          git add -- base/bin/devpanel-amd64 base/bin/devpanel-arm64
          if git diff --cached --quiet; then
            echo "Build produced no changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit \
              -m "Update devpanel CLI from GitLab devpanel-vn/cli@${UPSTREAM_SHA}" \
              -m "Built linux/amd64 and linux/arm64 from cmd/devpanel-client at that commit."

            commit_sha=$(git rev-parse HEAD)
            previous_run_id=$(gh run list \
              --workflow test.yml \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // 0')

            if push_output=$(git push origin "${commit_sha}:refs/heads/${TARGET_BRANCH}" 2>&1); then
              printf '%s\n' "${push_output}"
              test_branch="${TARGET_BRANCH}"
              test_event=workflow_dispatch
              gh workflow run test.yml --ref "${test_branch}"
            else
              push_status=$?
              printf '%s\n' "${push_output}"
              if ! grep -Eiq 'GH006|GH013|protected branch|repository rule violations|required status check' <<< "${push_output}"; then
                echo "::error::Direct push to ${TARGET_BRANCH} failed for a reason other than branch protection."
                exit "${push_status}"
              fi
              if [[ -z "${PR_TOKEN}" || -z "${PR_USER}" ]]; then
                echo "::error::GHCR_TOKEN with repo scope and GHCR_USER are required for protected-branch update PRs."
                exit 1
              fi
              echo "::notice::Branch protection rejected the direct push to ${TARGET_BRANCH}; opening or updating a pull request."
              target_hash=$(printf '%s' "${TARGET_BRANCH}" | sha256sum | cut -d ' ' -f 1)
              branch="devpanel-cli-update-${target_hash}-${UPSTREAM_SHA:0:12}"
              test_branch="${branch}"
              test_event=pull_request
              export GH_TOKEN="${PR_TOKEN}"
              auth=$(printf '%s:%s' "${PR_USER}" "${PR_TOKEN}" | base64 -w0)
              echo "::add-mask::${auth}"
              # Override checkout's workflow-token header for this push only.
              git -c http.https://github.com/.extraheader= \
                -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
                push --force origin "HEAD:refs/heads/${branch}"
              unset auth
              pr=$(gh pr list \
                --state all \
                --base "${TARGET_BRANCH}" \
                --head "${test_branch}" \
                --limit 100 \
                --json number,state,headRefName,headRepositoryOwner \
                | jq -r --arg branch "${test_branch}" --arg owner "${REPOSITORY_OWNER}" \
                  '.[] | select(.headRefName == $branch and .headRepositoryOwner.login == $owner and .state != "MERGED") | [.number, .state] | @tsv' \
                | head -n 1)
              title="Update DevPanel CLI binaries"
              body="Updates the DevPanel CLI binaries from GitLab revision ${UPSTREAM_SHA}. The pull request Test workflow validates the generated binaries."
              if [[ -n "${pr}" ]]; then
                read -r pr_number pr_state <<< "${pr}"
                gh pr edit "${pr_number}" --title "${title}" --body "${body}"
                if [[ "${pr_state}" == "CLOSED" ]]; then
                  gh pr reopen "${pr_number}"
                fi
              else
                gh pr create \
                  --base "${TARGET_BRANCH}" \
                  --head "${test_branch}" \
                  --title "${title}" \
                  --body "${body}"
              fi
              echo "cacheable=false" >> "$GITHUB_OUTPUT"
            fi

            test_run_id=""
            for ((attempt = 0; attempt < 60; attempt++)); do
              test_run_id=$(gh run list \
                --workflow test.yml \
                --branch "${test_branch}" \
                --event "${test_event}" \
                --limit 100 \
                --json databaseId,headSha \
                --jq "[.[] | select(.headSha == \"${commit_sha}\" and .databaseId > ${previous_run_id}) | .databaseId] | max // empty")
              if [[ -n "${test_run_id}" ]]; then
                break
              fi
              sleep 10
            done
            if [[ -z "${test_run_id}" ]]; then
              echo "::error::Timed out waiting for the Test workflow run for ${commit_sha}."
              exit 1
            fi
            echo "Waiting for Test workflow run ${test_run_id} on ${test_branch}."
            timeout 21600 gh run watch "${test_run_id}" --exit-status --interval 30
          fi

      - name: Record the built revision
        if: steps.commit-binaries.outputs.cacheable != 'false'
        env:
          UPSTREAM_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          mkdir -p "${RUNNER_TEMP}/devpanel-cli-revision"
          printf '%s\n' "${UPSTREAM_SHA}" > "${RUNNER_TEMP}/devpanel-cli-revision/sha"

      - name: Save the built revision
        if: steps.commit-binaries.outputs.cacheable != 'false'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/devpanel-cli-revision
          key: gitlab-devpanel-client-v1-${{ github.ref }}-${{ needs.plan.outputs.sha }}
